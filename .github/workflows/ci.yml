name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Verify bot
        run: |
          ruff check main.py src tests deploy/receive_release.py
          pytest
          python -m compileall -q main.py src deploy/receive_release.py
          bash -n deploy/apply_release.sh deploy/ssh_gateway.sh
