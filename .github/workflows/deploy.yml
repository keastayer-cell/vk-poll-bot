name: Deploy VK Bot

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vk-poll-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Verify bot
        run: |
          ruff check main.py src tests deploy/receive_release.py
          pytest
          python -m compileall -q main.py src deploy/receive_release.py
          bash -n deploy/apply_release.sh deploy/ssh_gateway.sh
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/vk_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify production launch is enabled
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vk_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" preflight
      - name: Upload release files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          tar --exclude=__pycache__ --exclude='*.pyc' -czf - \
            main.py src/vk_poll_bot requirements.txt | \
            ssh -i ~/.ssh/vk_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" upload
      - name: Apply release and check bot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vk_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" apply
      - name: Remove temporary key
        if: always()
        run: rm -f ~/.ssh/vk_deploy
